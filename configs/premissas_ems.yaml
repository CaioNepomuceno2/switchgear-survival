# Recorte: Energisa Mato Grosso do Sul (EMS, código ANEEL 404), cadastro BDGD de 31/12 de cada ano.
# Uso: python scripts/<script>.py --config configs/premissas_ems.yaml   (ou SWSURV_CONFIG=configs/premissas_ems.yaml)
# Tudo o que é de MS fica em subpastas ems: nada aqui escreve em reports/ nem em data/ na raiz.
# As escolhas de dados (anos com data, classes, limiares, janelas) estão justificadas em docs/decisoes_ems.md.
distribuidora: EMS
cod_aneel: 404          # confere a coluna DIST da BDGD (impede ler o cache de outra distribuidora)
nome: Energisa Mato Grosso do Sul
nome_curto: Energisa MS

paths:
  # SWSURV_CACHE, se definida, vence este caminho (vale para qualquer configuração: aponte-a para o cache certo)
  cache: data/cache/ems
  processed: data/ems/processed
  reports: reports/ems

bdgd:
  # snapshots de 31/12 de cada ano, versão mais recente de cada um (id do item no ArcGIS Hub da ANEEL).
  # Fora de propósito: o item avulso EMS_404_2022-10-31_V10 (c3585ae516f340b596617827d60da5ef) e a versão
  # de 17/12/2024 do snapshot de 2023 (b8c585ae35224ac8aa0648587ec61bcb), que não é a mais recente.
  snapshots:
    2018: 5382c59d7cc7494a9a1f8cd865187457   # Energisa_MS_404_2018-12-31_M10_20191023-2327
    2019: b83ad867a35b43189f41b68988f7f0b6   # Energisa_MS_404_2019-12-31_M10_20200323-1921
    2020: fe56dce0714f4b6795d3b23130f5898a   # Energisa_MS_404_2020-12-31_M10_20210628-1527
    2021: 933af69c57dd41ea8f6048118b8d07e7   # Energisa_MS_404_2021-12-31_V10_20230315-1800
    2022: ff5242147c86428e88971941a35c7cd1   # Energisa_MS_404_2022-12-31_V11_20240422-2036
    2023: 975f18dfdb0c479cb237893c5b296ca9   # Energisa_MS_404_2023-12-31_V11_20250923-1616
    2024: b7fad4cd388845a08a01643599ec747b   # Energisa_MS_404_2024-12-31_V11_20250730-1637
    2025: 9a1ce360865f4358b31e9fb2d016aac9   # Energisa_MS_404_2025-12-31_V11_20260830-0339
  # Zips já baixados (nomes bdgd_<ano>_<item>.gdb.zip), lidos sem extrair. Informe a pasta por --zips ou pela
  # variável SWSURV_BDGD_ZIPS (um caminho de outra máquina não deve ficar neste arquivo público). Sem pasta,
  # scripts/00_baixar_bdgd.py baixa do ArcGIS, como em MT.
  zips_locais: null
  # 2018 e 2019 (modelo M10) trazem DAT_IMO = 01/01/1920 em 100% dos equipamentos das quatro classes: ficam de fora,
  # como em MT. De 2020 em diante a data é válida em 88,9% a 100% (docs/decisoes_ems.md, seção 3).
  anos_com_data: [2020, 2021, 2022, 2023, 2024, 2025]

# Classes de ativo pelo Tipo de Unidade de Cadastro (TUC): os mesmos códigos de MT, conferidos nos dados de MS
# (docs/decisoes_ems.md, seção 4). Mudou só o rótulo do 210: 69% dos TUC 210 de MS (316 de 455 em 2025) estão em
# alta tensão (GRU_TEN = AT), então "disjuntor de média tensão" seria impreciso.
classes:
  religador:   {camada: EQSE, tuc: "345", nome: "Religador"}
  disjuntor:   {camada: EQSE, tuc: "210", nome: "Disjuntor (alta e média tensão)"}
  chave:       {camada: EQSE, tuc: "160", nome: "Chave (seccionadora e fusível)"}
  regulador:   {camada: EQRE, tuc: "340", nome: "Regulador de tensão"}

# Rastreamento dos pontos de religador (UNSEMT). TIP_UNID 32 confere em MS (seção 4). A latitude de referência, que
# converte graus de longitude em metros, é a mediana dos pontos de religador de MS em 2019 a 2025 (-20,5 a -20,7).
pontos:
  tip_unid_religador: "32"
  tolerancia_m: 30
  lat_ref_graus: -20.6

# Mesmas janelas e limiares de MT (seções 5 e 6 de docs/decisoes_ems.md): os dados de MS não dão motivo para mudar
# nenhum deles, e mudar um limiar depois de ver os indicadores seria ajustar o teste ao resultado.
analise:
  # transições usadas no ajuste principal (ano do cadastro inicial -> seguinte)
  transicoes_principal: [2021, 2022, 2023, 2024]
  # 2020->2021 é o ano em que as datas passam a ser preenchidas (88,9% dos disjuntores e 90,9% das chaves datados em
  # 2020): vira sensibilidade, como em MT
  transicoes_sensibilidade: [2020, 2021, 2022, 2023, 2024]
  nome_cenario_sensibilidade: com_2020_2021
  sufixo_sensibilidade: com_2021
  # validação fora da amostra (transição t = cadastro t -> t+1)
  validacoes:
    - {nome: "ajuste 2022-2023, teste 2024-2025", ajuste: [2021, 2022], teste: [2023, 2024]}
    - {nome: "ajuste 2022-2024, teste 2025", ajuste: [2021, 2022, 2023], teste: [2024]}
  # baseline "idade-limite": troca tudo que atinge esta idade (parâmetro, não é a vida regulatória)
  idade_limite_anos: 25
  # limiar de qualidade: acréscimos em safras antigas / quedas acima disto => classe não confiável
  limite_reversoes: 0.25
  # e/ou fração de safras cuja contagem volta a subir depois de cair acima disto => não confiável
  limite_nao_monotonas: 0.10
  bootstrap: 500
  seed: 7

projecao:
  inicio: 2026
  fim: 2035
  # custo unitário de substituição (R$, material + instalação) - ILUSTRATIVO; null = sem custo.
  # Só entra na conta se alguma classe passar no teste de consistência (hoje nenhuma passa em MS).
  custo_unitario_rs:
    religador: 160000     # mesma premissa ilustrativa de MT e do projeto automation-impact
    disjuntor: null
    chave: null
    regulador: null
  # Vida útil regulatória (anos): em branco em MS, pelo mesmo motivo de MT. A Tabela XVI do Manual de Controle
  # Patrimonial (anexo da REN ANEEL 674/2015) não pôde ser lida (o site da ANEEL respondeu HTTP 403 ao acesso
  # automatizado em 06/11/2026) e cópias de terceiros não foram usadas. Nenhum código do projeto lê este parâmetro.
  vida_util_regulatoria_anos:
    religador: null
    disjuntor: null
    chave: null
    regulador: null

figuras:
  rotular_distribuidora: true          # acrescenta "Energisa MS" ao título das figuras
  complemento_taxa: ""                 # MT escreve ": o risco cresce com a idade", conclusão que MS não tem
  classes_frota: [religador, disjuntor]    # figura 03 quando nenhuma classe passa no teste
  classes_qualidade: [religador, disjuntor]  # figura 06 (contagem por safra)
  reversoes_por_transicao: true        # figura 07
