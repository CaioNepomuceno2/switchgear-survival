[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swsurv"
version = "0.1.0"
description = "Vida útil e substituição de religadores, disjuntores, chaves e reguladores com dados abertos da ANEEL (BDGD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.12",
  "pyyaml>=6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dados = ["pyogrio>=0.9", "geopandas>=1.0", "requests>=2.32"]
# pyogrio e geopandas: os testes criam um File Geodatabase minúsculo para exercitar a leitura de zips locais
dev = ["pytest>=8", "ruff>=0.6", "pyogrio>=0.9", "geopandas>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
